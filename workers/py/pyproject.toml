[project]
name = "narrowmind-workers"
version = "0.0.0"
description = "NarrowMind Studio — Python ML workers (ingestion, training, inference, rag, eval, export)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hasancan", email = "hasanhccan@gmail.com" }]
dependencies = [
    # Ingestion (Phase 2)
    "pymupdf>=1.24",         # PDF text extraction
    "ebooklib>=0.18",        # EPUB extraction
    "python-docx>=1.1",      # DOCX extraction
    "trafilatura>=1.12",     # web boilerplate removal + extraction
    "wikipedia-api>=0.7",    # Wikipedia category scrape
    "datasets>=3.0,<5",      # HuggingFace datasets (streaming default); bounded — streaming API drifts
    "beautifulsoup4>=4.12",  # HTML helper for fixtures and fallback parsing
    # Cleaning (Phase 2)
    "datasketch>=1.6",          # MinHash near-duplicate detection
    "lingua-language-detector>=2.0",  # pure-python language identification
    # Chunking (Phase 2)
    "pysbd>=0.3",            # sentence boundary detection
    "tiktoken>=0.8",         # cl100k_base for chunk-size estimation, offline (no HF download)
    # Phase 3 — RAG (embedding + vector store)
    #
    # ML-core deps carry UPPER bounds since the lancedb 0.30 incident: list_tables()
    # silently changed return shape between minors and every vector-store upsert lost
    # its rows while unit tests stayed green (docs/testing.md § library pinning).
    # The ranges define a deliberate upgrade window; widening one requires running
    # tests/test_contract_probes.py, which pins the exact behavioral contracts we
    # depend on (return shapes, embedding dims, score fields).
    "torch>=2.2,<3",                  # CPU-only via [tool.uv.sources] below
    "sentence-transformers>=3.0,<6",  # BGE-small embedder, lazy-loaded on first build_dataset
    "lancedb>=0.30,<0.40",            # embedded vector store; 0.30 = ListTablesResponse API era
    "pyarrow>=17.0,<25",              # lancedb dep; bounded so resolver can't pick incompatible
    # Phase 3 — inference. llama-cpp-python CUDA 12.5 prebuilt from abetlen's GitHub
    # release attachment (requires system-wide CUDA Toolkit 12.5 — README/dev-setup.md
    # flags this prereq). Pinned to a direct URL because abetlen ships cu125 only as
    # release assets, not via a PEP503 index. Linux + macOS dev defers to source build
    # from PyPI (slow but works).
    "llama-cpp-python[server] @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.23-cu125/llama_cpp_python-0.3.23-py3-none-win_amd64.whl ; sys_platform == 'win32'",
    "llama-cpp-python[server]>=0.3 ; sys_platform != 'win32'",
]

# Force a CPU-only torch wheel so the default ~2 GB CUDA wheel doesn't bloat the install
# (BGE-small runs fine on CPU).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required so the direct-URL dependency for the Windows cu125 llama-cpp-python wheel
# (a GitHub release asset, not a PyPI package) is accepted by the build backend.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["narrowmind_workers"]
