[workspace]
resolver = "2"
members = [
    "crates/orchestrator",
    "crates/agent",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/hccancan4/narrowmind-studio"
authors = ["Hasancan <hasanhccan@gmail.com>"]

[workspace.dependencies]
# async runtime
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "fs"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1.10"
# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
# errors
thiserror = "2.0"
anyhow = "1.0"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# http (rustls for portability — no openssl/native-tls system deps)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# secret storage in the OS keychain
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
# misc
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
# os-aware standard directories (data_dir / config_dir on win/mac/linux)
dirs = "5.0"
# rng for seeded train/eval splits
rand = "0.8"
rand_chacha = "0.3"
# tauri
tauri = { version = "2.1" }
tauri-build = { version = "2.0" }
# crates in this workspace
narrowmind-orchestrator = { path = "crates/orchestrator" }
narrowmind-agent = { path = "crates/agent" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
