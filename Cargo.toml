[workspace]
resolver = "2"
members = [
    "crates/orchestrator",
    "crates/agent",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/hccancan4/narrowmind-studio"
authors = ["Hasancan <hasanhccan@gmail.com>"]

[workspace.dependencies]
# async runtime
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# errors
thiserror = "2.0"
anyhow = "1.0"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tauri
tauri = { version = "2.1" }
tauri-build = { version = "2.0" }
# crates in this workspace
narrowmind-orchestrator = { path = "crates/orchestrator" }
narrowmind-agent = { path = "crates/agent" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
