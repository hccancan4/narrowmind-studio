[package]
name = "narrowmind-orchestrator"
description = "NarrowMind Studio — Rust runtime: project state, Python worker lifecycle, IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# ProjectError carries toml::de::Error (~256 bytes); boxing every variant is over-engineering
# for an enum that's already on a cold path.
result_large_err = "allow"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
tempfile = "3.13"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
