[project]
name = "narrowmind-studio"
version = "0.0.0"
description = "NarrowMind Studio — workspace root for Python ML workers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hasancan", email = "hasanhccan@gmail.com" }]
dependencies = [
    "narrowmind-workers",
]

[tool.uv.workspace]
members = ["workers/py"]
# py-training is deliberately NOT a workspace member: it needs CUDA torch
# while this workspace pins CPU torch, and uv workspaces share one lockfile —
# the two torch sources cannot coexist there. It is a standalone uv project
# with its own .venv + uv.lock, consuming narrowmind-workers as an editable
# path dependency (one source tree, two environments). See docs/dev-setup.md.
exclude = ["workers/py-training"]

[tool.uv.sources]
narrowmind-workers = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["workers/py/tests"]
pythonpath = ["workers/py"]
addopts = "-q"
