name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rust:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        # libayatana-appindicator3-dev Conflicts: libappindicator3-dev on
        # ubuntu-24.04 — install only the ayatana flavor (Tauri v2's pick).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # tauri::generate_context! validates frontendDist (../dist) at compile
      # time; CI never builds the frontend, so provide the empty dir.
      - name: Stub frontend dist for tauri context macro
        run: mkdir -p apps/desktop/dist

      - name: cargo check
        run: cargo check --workspace --all-targets

      # `clippy::pedantic` is enabled at warn level in the crates' [lints] as
      # an ADVISORY set — the accepted-warning count is tracked as "clippy
      # parity" in docs/testing.md, not enforced. CI denies only the default
      # (deny-worthy) lint groups.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::pedantic

      - name: cargo test
        run: cargo test --workspace --lib

  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: uv sync
        run: uv sync

      - name: pytest
        run: uv run pytest -q

  frontend:
    name: pnpm typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` input: pnpm/action-setup reads the exact pin from
      # package.json's `packageManager` field (passing both is an error).
      # pnpm is set up BEFORE node so setup-node's built-in `cache: pnpm`
      # (which replaced the hand-rolled store-path + actions/cache dance —
      # `pnpm store path` printed nothing under the corepack shim, so the
      # cache step failed on a missing `path` input) can resolve the store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm -r typecheck
